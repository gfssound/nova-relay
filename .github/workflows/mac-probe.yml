# Nov 18: which GitHub Mac machines this account can use (run by hand; safe to delete).
name: Mac probe
on: workflow_dispatch
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15, macos-13, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - run: uname -a && sw_vers && which hdiutil osacompile codesign
