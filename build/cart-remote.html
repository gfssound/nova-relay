<title>Nova Relay prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=Martian+Mono:wght@400;500;700&family=Rubik:wght@500;600;700&family=Azeret+Mono:wght@500;600&display=swap">
<style>
/* Layout: one-screen control surface. Status strip → transport bar → tab rail → scrolling work area. Dark by design: it lives on a sound cart at night. */
:root{
  color-scheme: dark;
  --ground:#101417;      /* cart-case slate, blue-green bias */
  --surface:#171d21;
  --raised:#212a30;
  --raised-2:#2b363d;
  --line:#33424b;
  --fg:#e3eaed;
  --muted:#8b9aa3;
  --dim:#5c6b74;
  --accent:#e7a43c;      /* tally amber */
  --accent-ink:#1b1305;
  --accent-line:var(--accent);
  --rec:#e5484d;
  --ok:#46c28a;
  --warn:#efc23b;
  --meter-bg:#0b0f11;
  --ref:#3d9bff;         /* reference line */
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Chivo Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:6px;
  --t-xs:11px; --t-sm:13px; --t-md:15px; --t-lg:20px; --t-xl:28px;
}
html,body{height:100%}
body{background:var(--ground);color:var(--fg);font-family:var(--f-body);font-size:var(--t-md);margin:0;-webkit-tap-highlight-color:transparent}
.app{height:100%;display:grid;grid-template-rows:auto auto auto 1fr;min-height:0}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent-line);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.lbl{font-family:var(--f-display);font-weight:600;font-size:var(--t-xs);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}

/* status strip */
.status{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:8px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{font-family:var(--f-display);font-weight:700;font-size:var(--t-lg);letter-spacing:.04em;text-transform:uppercase;margin-right:auto;display:flex;align-items:baseline;gap:10px}
.brand small{font-weight:500;font-size:var(--t-sm);letter-spacing:.06em;color:var(--muted)}
.stat{display:flex;flex-direction:column;gap:1px;min-width:0}
.stat b{font-family:var(--f-mono);font-weight:400;font-size:var(--t-sm);font-variant-numeric:tabular-nums;white-space:nowrap}
.hpbtn{display:flex;flex-direction:column;align-items:flex-start;gap:1px;background:var(--raised);border:1px solid var(--line);border-radius:var(--r);padding:4px 12px;min-height:44px;justify-content:center;text-align:left;max-width:220px}
.hpbtn b{font-family:var(--f-display);font-weight:700;font-size:var(--t-md);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.hpbtn:hover{border-color:var(--accent-line)}
.pill{display:inline-flex;align-items:center;gap:7px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);font-size:var(--t-sm);background:var(--raised);white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 6px var(--ok)}
.pill.warn i{background:var(--warn);box-shadow:0 0 6px var(--warn)}  /* shipped versions: no Nova connected */

/* transport bar */
.transport{display:grid;grid-template-columns:auto 1fr auto;gap:20px;align-items:center;padding-block:14px;border-bottom:1px solid var(--line)}
.tc-wrap{display:flex;flex-direction:column;gap:2px}
.tc{font-family:var(--f-mono);font-weight:700;font-size:clamp(28px,5vw,46px);line-height:1;letter-spacing:.02em;font-variant-numeric:tabular-nums;color:var(--fg)}
.tc.recording{color:var(--rec)}
.tc-sub{display:flex;gap:12px;font-size:var(--t-sm);color:var(--muted)}
.stfile{color:var(--text)}
.znsrc{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--tick-warn,var(--warn))}
.znsrc:empty{display:none}
.mval{font-size:13px;font-weight:700;color:var(--tick,var(--fg))}
.slate{display:flex;gap:10px;min-width:0;flex-wrap:wrap}
.slate button{background:var(--raised);border:1px solid var(--line);border-radius:var(--r);padding:6px 12px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:72px}
.slate button b{font-family:var(--f-display);font-size:var(--t-xl);font-weight:600;line-height:1}
.slate button.note{min-width:0;flex:1;max-width:280px}
.slate button.live{border-color:var(--rec);box-shadow:inset 0 0 0 1px var(--rec)}  /* Nov 13 (Ferris): a touch thicker while rolling (2 px, without moving the text) */
.slate button.live .lbl{color:var(--rec)}
.slate button.hpslate.solo{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,var(--raised))}
.slate button.hpslate.solo b,.slate button.hpslate.solo .lbl{color:var(--warn)}
.solonote{color:var(--warn);font-size:var(--t-sm);font-weight:600}
.slate button.hpslate{min-width:0;max-width:220px}
.slate button.hpslate b{font-size:var(--t-lg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.slate button.hpslate:hover{border-color:var(--accent-line)}
.slate button.note b{font-size:var(--t-lg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tbtns{display:flex;gap:8px;align-items:stretch}
.tb{width:64px;height:58px;border-radius:var(--r);border:1px solid var(--line);background:var(--raised);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:var(--t-sm);letter-spacing:.08em}
.tb svg{width:22px;height:22px;display:block;margin:0 auto 3px}
.tb[aria-pressed="true"]{background:var(--raised-2);border-color:var(--fg)}
.tb.rec{color:var(--rec)}
/* Transport row: every tile and button the same size */
.slate button,.tb{width:120px;height:76px;box-sizing:border-box;flex:none}
.slate button{justify-content:center;max-width:none}
.slate button b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tb{font-size:var(--t-md)}
.tb svg{width:26px;height:26px}
.tbtns{align-items:center}
/* REC and STOP: heavier outlines and fills so they read at a glance */
#bStop{border:2px solid var(--fg);background:var(--raised-2);color:var(--fg)}
#bStop[aria-pressed="true"]{background:var(--fg);color:var(--ground);border-color:var(--fg)}
#bRec{border:2px solid var(--rec);background:color-mix(in srgb,var(--rec) 16%,var(--raised));color:var(--rec)}
#bRec[aria-pressed="true"]{background:var(--rec);color:#fff;border-color:var(--rec)}
/* hold to record: a fill rises while REC is held */
#bRec{position:relative;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#bRec > span:not(.hold){position:relative;z-index:1}
.tb .hold{position:absolute;inset:0;background:var(--rec);opacity:.6;transform:scaleY(0);transform-origin:bottom;pointer-events:none;transition:transform .12s ease-out}
.tb.holding .hold{transform:scaleY(1);transition:transform var(--holdms,600ms) linear}
#bTone .hold{background:var(--ok);opacity:.45}
#bStop{overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#bStop > span:not(.hold){position:relative;z-index:1}
#bStop .hold{background:var(--fg);opacity:.35}
#bRec[aria-pressed="true"] .hold{background:#fff;opacity:.35}
@media (max-width:520px){.slate button,.tb{flex:1 1 0;width:auto;min-width:0}}
.tb.rec[aria-pressed="true"]{background:var(--rec);color:#fff;border-color:var(--rec);animation:blink 1s steps(2,start) infinite}
.tb.tone[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent-line)}
@keyframes blink{50%{box-shadow:0 0 0 3px rgba(229,72,77,.35)}}
@media (prefers-reduced-motion:reduce){.tb.rec[aria-pressed="true"]{animation:none}}

/* tabs */
.tabs{display:flex;gap:2px;overflow-x:auto;background:var(--surface);border-bottom:1px solid var(--line);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px 9px;font-family:var(--f-display);font-weight:600;font-size:var(--t-md);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent-line)}
main{overflow:auto;min-height:0;padding-block:18px 28px}

/* generic blocks */
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,340px);gap:20px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h3{margin:0;font-family:var(--f-display);font-weight:600;font-size:var(--t-lg);letter-spacing:.03em;text-wrap:balance}
.row{display:grid;grid-template-columns:minmax(90px,140px) minmax(0,1fr);gap:10px;align-items:center}
.row > .lbl{line-height:1.2}
.stack{display:flex;flex-direction:column;gap:12px}
.hint{font-size:var(--t-sm);color:var(--muted);line-height:1.45;margin:0;max-width:65ch}
.flex{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* controls */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;flex-wrap:wrap}
.seg-b{background:var(--raised);border:0;border-right:1px solid var(--line);padding:7px 12px;font-size:var(--t-sm);font-weight:600;min-width:44px}
.seg-b:last-child{border-right:0}
.seg-b[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.chip{background:var(--raised);border:1px solid var(--line);border-radius:var(--r);padding:7px 12px;font-size:var(--t-sm);font-weight:600;min-width:44px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent-line);color:var(--accent-ink)}
.chip.red[aria-pressed="true"]{background:var(--rec);border-color:var(--rec);color:#fff}
.sel,.txt{background:var(--raised);border:1px solid var(--line);border-radius:var(--r);padding:7px 10px;font-size:var(--t-sm);min-width:0;max-width:100%}
.txt{width:100%;box-sizing:border-box}
.num{display:grid;grid-template-columns:36px minmax(60px,1fr) 36px minmax(64px,auto);gap:6px;align-items:center}
.num.compact{grid-template-columns:32px minmax(52px,auto) 32px}
.num button{height:32px;border-radius:var(--r);border:1px solid var(--line);background:var(--raised);font-size:18px;line-height:1;padding:0}
.num output{font-family:var(--f-mono);font-size:var(--t-sm);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.num.compact output{text-align:center}
input[type=range]{width:100%;accent-color:var(--accent);min-width:0}
input[type=color]{width:44px;height:32px;border:1px solid var(--line);border-radius:var(--r);background:var(--raised);padding:2px}

/* meters */
.bridge{background:var(--meter-bg);border:1px solid var(--line);border-radius:var(--r);padding:10px 10px 6px;min-width:0}
.bridge canvas{display:block;width:100%;height:clamp(240px,42vh,420px)}
.arms{display:grid;gap:4px;margin-top:6px}
.arm{background:var(--raised);border:1px solid var(--line);border-radius:4px;padding:5px 2px;font-family:var(--f-display);font-weight:600;font-size:12px;letter-spacing:.03em;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.arm i{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--dim)}
.arm[aria-pressed="true"] i{background:var(--rec);border-color:var(--rec)}
.arm span{max-width:100%;overflow:hidden;text-overflow:ellipsis}

/* inputs */
.chlist{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px}
@media (max-width:900px){.chlist{grid-template-columns:repeat(4,minmax(0,1fr))}}
.ch{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto 5px;gap:5px 8px;align-items:center;background:var(--raised);border:1px solid var(--line);border-radius:var(--r);padding:6px 9px;text-align:left}
.ch[aria-pressed="true"]{border-color:var(--accent-line);box-shadow:inset 0 0 0 1px var(--accent-line)}
.ch .n{font-family:var(--f-mono);font-size:var(--t-xs);color:var(--muted)}
.ch .zid{margin-left:5px;padding:0 3px;border:1px solid var(--line);border-radius:2px;font-size:.9em;color:var(--accent)}
.ch .nm{font-family:var(--f-display);font-weight:600;font-size:var(--t-md);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
.ch .sw{width:9px;height:9px;border-radius:2px;flex:none}
.ch .nm > span:last-child{min-width:0;overflow:hidden;text-overflow:ellipsis}
.ch .bar{grid-column:1/-1;height:5px;background:var(--meter-bg);border-radius:3px;overflow:hidden}
.ch .bar div{height:100%;width:100%;transform-origin:left;transform:scaleX(0);background:var(--ok)}
.flags{display:flex;gap:4px;flex-wrap:wrap}
.flag{font-family:var(--f-display);font-size:11px;font-weight:600;letter-spacing:.05em;padding:1px 5px;border-radius:3px;border:1px solid var(--line);color:var(--dim)}
.flag.on{color:var(--accent-line);border-color:var(--accent-line)}
.sub{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}

/* matrix */
.mx-wrap{overflow:auto;max-width:100%;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.mx{border-collapse:separate;border-spacing:0;font-size:var(--t-sm)}
.mx th{position:sticky;background:var(--surface);font-family:var(--f-display);font-weight:600;letter-spacing:.03em;padding:6px 6px;white-space:nowrap;z-index:1}
.mx thead th{top:0;writing-mode:vertical-rl;transform:rotate(180deg);text-align:left;height:100px;vertical-align:bottom;border-bottom:1px solid var(--line)}
.mx tbody th{left:0;text-align:left;border-right:1px solid var(--line);min-width:96px}
.mx thead th:first-child{left:0;z-index:2;writing-mode:horizontal-tb;transform:none;vertical-align:bottom}
.mx td{padding:2px}
.cell{width:36px;height:28px;border-radius:4px;border:1px solid var(--line);background:var(--raised);font-family:var(--f-mono);font-size:12px;padding:0;color:var(--muted)}
.cell.v1{background:color-mix(in srgb,var(--accent) 18%,var(--raised));color:var(--fg)}
.cell.v2{background:color-mix(in srgb,var(--accent) 30%,var(--raised));color:var(--fg)}
.cell.v3{background:color-mix(in srgb,var(--accent) 44%,var(--raised));color:var(--fg)}
.cell.v4{background:color-mix(in srgb,var(--accent) 58%,var(--raised));color:var(--accent-ink)}
.cell.v5{background:color-mix(in srgb,var(--accent) 72%,var(--raised));color:var(--accent-ink)}
.cell.v6{background:color-mix(in srgb,var(--accent) 86%,var(--raised));color:var(--accent-ink)}
.cell.v7{background:var(--accent);color:var(--accent-ink);border-color:var(--accent-line)}
/* Headphone sides: LR blue, L green, R red, split teal; flipped polarity gets a yellow dashed ring */
.ocell.hlr,.hplegend .hlr{background:#4aa3df;border-color:#4aa3df;color:#04121c}
.ocell.hl,.hplegend .hl{background:var(--ok);border-color:var(--ok);color:#06140c}
.ocell.hr,.hplegend .hr{background:var(--rec);border-color:var(--rec);color:#fff}
.ocell.hsplit{background:#2fb8c4;border-color:#2fb8c4;color:#04171a}
.ocell.hlr .otop,.ocell.hlr .ost,.ocell.hl .otop,.ocell.hl .ost,.ocell.hr .otop,.ocell.hr .ost,.ocell.hsplit .otop,.ocell.hsplit .ost{color:inherit;opacity:.85}
.ocell.flip,.hplegend .flip{outline:3px dashed var(--warn);outline-offset:-4px}
.hplegend{display:flex;flex-wrap:wrap;gap:8px}
.hplegend span{font-family:var(--f-display);font-weight:600;font-size:12px;letter-spacing:.04em;padding:3px 9px;border-radius:3px;border:1px solid var(--line)}
.hplegend .flip{color:var(--fg);background:var(--raised)}
.hppanel{gap:12px}
.hptitle{gap:12px;flex-wrap:wrap}
.hptitle h3{margin:0}
.orgrid.x10{grid-template-columns:repeat(10,minmax(0,1fr))}
@media (max-width:640px){.orgrid.x10{grid-template-columns:repeat(5,minmax(0,1fr))}}
.hpsel{min-width:200px;font-size:var(--t-md);padding:8px 10px}
.hpbig{font-family:var(--f-display);font-size:var(--t-lg)}
.orgrid .ocell .otop span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell.hpc{width:44px;font-size:11px;font-weight:600}
.cell.hpc.on{background:var(--ok);border-color:var(--ok);color:#06140c}
.cell.hpc.inv{background:var(--warn);border-color:var(--warn);color:#1a1405}
.hpmx th.grp,.hpmx td.grp{border-left:1px solid var(--line)}
.hprow{display:flex;align-items:center;gap:8px}
.hpn{font-size:11px;color:var(--muted)}
.hpmx .hpname{width:130px;padding:5px 8px;font-family:var(--f-display);font-weight:600}
.hpmx tbody th{min-width:170px}
.hpbus th,.hpbus td{border-top:1px solid var(--line);padding-top:6px}

/* tables */
.tbl-wrap{overflow-x:auto;max-width:100%}
table.list{border-collapse:collapse;width:100%;font-size:var(--t-sm)}
table.list th{font-family:var(--f-display);font-weight:600;font-size:var(--t-xs);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
table.list td{padding:7px 8px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;vertical-align:middle}
/* take history rows open the take editor */
table.hist .hrow{cursor:pointer}
table.hist .hrow:hover td,table.hist .hrow:focus-visible td{background:var(--raised)}
table.hist td.hseg{color:var(--muted)}
#hist-scene,#hist-take,#hist-note{text-transform:uppercase}
table.hist td.hnote{max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
table.hist td.hedit{text-align:right;width:1%}
table.hist td.hedit .btn{padding:4px 10px;font-size:var(--t-xs)}
@media (max-width:600px){ table.hist td.hstart,table.hist th:nth-child(4){display:none} table.hist td,table.hist th{padding:6px 5px} table.hist td.hnote{max-width:110px} }
.presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px}
.presets .chip{text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* log */
.log{font-family:var(--f-mono);font-size:12px;line-height:1.55;background:var(--meter-bg);border:1px solid var(--line);border-radius:var(--r);padding:10px;overflow:auto;max-height:60vh;min-height:200px;white-space:pre}
.log .tx{color:var(--accent-line)}
.log .rx{color:var(--ok)}
.log .ev{color:var(--muted)}
.btn{background:var(--raised);border:1px solid var(--line);border-radius:var(--r);padding:7px 14px;font-size:var(--t-sm);font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent-line);color:var(--accent-ink)}
.conn{display:grid;gap:8px}
.conn label{display:grid;grid-template-columns:20px 1fr;gap:4px 10px;align-items:start;background:var(--raised);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.conn label[data-off]{opacity:.6}
.conn label span b{display:block;font-weight:600}
.conn label span em{font-style:normal;font-size:var(--t-sm);color:var(--muted)}
.cat{margin-top:6px}
.cat > summary{font-family:var(--f-display);font-weight:600;font-size:var(--t-lg);cursor:pointer;padding:6px 0;letter-spacing:.03em}
.prm{display:grid;grid-template-columns:minmax(150px,240px) minmax(0,1fr);gap:8px 14px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.prm .meta{display:flex;flex-direction:column;gap:2px;min-width:0}
.prm .meta b{font-weight:600;font-size:var(--t-sm);overflow-wrap:anywhere}
.prm .meta code{font-family:var(--f-mono);font-size:11px;color:var(--dim);overflow-wrap:anywhere}
.idx{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.idx .sel{padding:5px 6px}
.ro{font-family:var(--f-mono);font-size:12px;color:var(--muted);overflow-wrap:anywhere}

/* ---- Layout: Console strips (desk) ---- */
body[data-layout="console"]{
  --ground:#0a0b0c; --surface:#121416; --raised:#16181b; --raised-2:#20242a; --line:#2a2e33;
  --fg:#e8e8e6; --muted:#9a9fa5; --dim:#6b7178; --accent:#acebfc; --accent-ink:#0a0b0c; --accent-line:#acebfc;
  --rec:#ff4d4f; --ok:#2fd27a; --warn:#ffc93c; --meter-bg:#0a0b0c;
  --f-display:"Saira Condensed","Arial Narrow",system-ui,sans-serif;
  --f-mono:"Martian Mono",ui-monospace,Menlo,Consolas,monospace; --r:4px;
}
.strips-wrap{overflow-x:auto;max-width:100%}
.strips{display:grid;gap:6px;min-width:0}
.strip{background:var(--raised);border:1px solid var(--line);border-radius:var(--r);padding:6px;display:flex;flex-direction:column;gap:6px;min-width:0;position:relative}
/* Nov 14 (0.6.1): fader cap on the meter. A light cap with a dark centre line, like a real fader; hollow (dashed) until
   Nova Relay has set it. The hit area is bigger than the cap; only the cap takes touches. */
.fcap{position:absolute;z-index:3;height:28px;transform:translateY(-50%);display:flex;align-items:center;touch-action:none;cursor:grab}
.fcap[hidden]{display:none}
/* grey cap, a dark centre line and two grip lines, overhanging the meter: it can't be mistaken for a white peak line */
.fcap i{display:block;width:100%;height:14px;box-sizing:border-box;border-radius:3px;border:1px solid #050606;box-shadow:0 2px 6px rgba(0,0,0,.65);
  background:linear-gradient(#15191c,#15191c) center/100% 2px no-repeat,linear-gradient(#59636b,#59636b) center calc(50% - 4px)/100% 1px no-repeat,
    linear-gradient(#59636b,#59636b) center calc(50% + 4px)/100% 1px no-repeat,linear-gradient(#dfe5ea,#aeb8c0)}
.fcap.unknown i{background:rgba(8,9,10,.45);border:1.5px dashed #c9d1d8;box-shadow:none}
.fcap.drag{cursor:grabbing}
.fcap.drag i,.fcap:focus-visible i{outline:2px solid var(--accent,#4da3ff);outline-offset:1px}
.fcap.h{height:auto;width:28px;transform:translateX(-50%);flex-direction:column;justify-content:center}
.fcap.h i{width:14px;height:100%;
  background:linear-gradient(#15191c,#15191c) center/2px 100% no-repeat,linear-gradient(#59636b,#59636b) calc(50% - 4px) center/1px 100% no-repeat,
    linear-gradient(#59636b,#59636b) calc(50% + 4px) center/1px 100% no-repeat,linear-gradient(90deg,#dfe5ea,#aeb8c0)}
.fcap.h.unknown i{background:rgba(8,9,10,.45)}
.fcap .fread{display:none;position:absolute;bottom:calc(100% + 2px);left:50%;transform:translateX(-50%);padding:1px 5px;border-radius:4px;background:#0a0b0c;color:#fff;border:1px solid #2c3238;font:700 11px/1.3 var(--f-mono,monospace);white-space:nowrap;pointer-events:none}
.fcap.drag .fread,.fcap:focus-visible .fread{display:block}
.fcap.h .fread{bottom:calc(100% + 1px)}
.scrib{border-radius:2px;padding:4px 2px;text-align:center;font-family:var(--f-display);font-weight:700;font-size:clamp(11px,calc(0.9vw + 6px),17px);letter-spacing:.03em;color:#0a0b0c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sinfo{display:flex;justify-content:space-between;gap:4px;font-family:var(--f-mono);font-size:11px;font-weight:700;color:var(--tick);white-space:nowrap}
.led{display:block;width:100%;height:var(--ledh,clamp(220px,42vh,420px))}
.strip.soloed{border-color:var(--warn);box-shadow:inset 0 0 0 2px var(--warn)}
/* PFL keys (Nov 1): yellow when on, like the Aria's PFL light */
.pflb{font-family:var(--f-display);font-weight:700;font-size:13px;letter-spacing:.08em;line-height:1;padding:6px 0;min-height:32px;border:1px solid var(--line);border-radius:2px;background:transparent;color:var(--muted)}
.pflb:hover:not(:disabled):not(.on){border-color:var(--warn);color:var(--warn)}
.pflb.on,.pflb.on:hover{background:var(--warn);border-color:var(--warn);color:#111}
.pflb.on:hover{filter:brightness(1.12)}  /* Nov 2: hover on a lit key keeps dark text (was yellow on yellow) */
.pflb.nofader{visibility:hidden}
.pflb.head{padding:6px 14px;min-height:36px;font-size:14px}
/* Nov 7 (Ferris): smaller PFL key on the meters, with a dark gap all round, so a lit key doesn't run into the yellow solo outline. */
.strip .pflb{align-self:center;width:calc(100% - 20px);min-height:24px;padding:4px 0;margin:2px 0 6px;font-size:12px}
.sflags{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px}
.sflags span{text-align:center;font-family:var(--f-display);font-size:11px;font-weight:600;padding:2px 0;border:1px solid var(--line);border-radius:2px;color:var(--dim)}
.sflags span.p48{color:var(--rec)}
.sflags span.on{color:var(--accent-line)}
.sarm{height:44px;border-radius:3px;border:1px solid var(--line);background:var(--ground);color:var(--muted);font-family:var(--f-display);font-weight:700;font-size:14px;letter-spacing:.12em}
.sarm[aria-pressed="true"]{background:var(--rec);border-color:var(--rec);color:#0a0b0c}
.sarm:disabled{opacity:.35;cursor:default}

.strip.scale{background:none;border-color:transparent;padding-inline:0}
/* Record Enables page */
.armgrid{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:8px}
@media (max-width:900px){.armgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:420px){.armgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.armbtn{min-height:84px;border-radius:var(--r);border:1px solid var(--line);background:var(--raised);display:flex;flex-direction:column;justify-content:space-between;gap:8px;padding:10px 12px;text-align:left;min-width:0}
.armbtn .atop{display:flex;justify-content:space-between;align-items:center;gap:6px;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.armbtn .ains{font-family:var(--f-mono);font-size:var(--t-xs);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.armbtn[aria-pressed="true"] .ains{color:inherit;opacity:.85}
.armbtn .ains[hidden]{display:none}
.armbtn .an{font-family:var(--f-display);font-weight:700;font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.armbtn[aria-pressed="true"]{background:var(--rec);border-color:var(--rec);color:#fff}
.armbtn[aria-pressed="true"] .atop{color:rgba(255,255,255,.85)}
.armbtn[aria-pressed="true"] .atop i{background:#fff;border-color:#fff}
.lockhint{display:none}
body[data-rec="1"] .lockhint{display:block;color:var(--rec)}
body[data-rec="1"] .armall{cursor:not-allowed;opacity:.55}
/* Arming is locked while recording */
body[data-rec="1"] .sarm,body[data-rec="1"] .harm,body[data-rec="1"] .rt{cursor:not-allowed;opacity:.55}
body[data-rec="1"] .harm i{opacity:1}
/* Note buttons */
.npgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px 16px}
.notebtn{background:none;border:1px dashed transparent;border-radius:var(--r);padding:6px 8px;margin:-6px -8px;text-align:left;font:inherit;color:inherit;min-height:36px;cursor:pointer}
.notebtn:hover{border-color:var(--line);background:var(--raised)}
.notebtn.wide{flex:1;margin:0;background:var(--raised);border:1px solid var(--line);font-family:var(--f-display);font-weight:600;font-size:var(--t-md);min-height:40px}
/* Next-take pop-up */
.recdot{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--rec);margin-right:10px;vertical-align:middle}
.modal.nt{width:min(560px,100%)}
.ntnow{font-size:var(--t-sm);color:var(--muted)}
.ntdirty{color:var(--warn);font-size:var(--t-sm)}
.mvia{font-size:var(--t-xs);color:var(--muted);margin:0}
.rxfreq{font-size:.6em;font-weight:500;color:var(--muted);margin-left:6px;letter-spacing:.02em}
.txst{font-family:var(--f-display);font-size:.5em;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;border-radius:3px;border:1px solid var(--ok);color:var(--ok);margin-left:6px;vertical-align:middle}
.txst[data-st="Standby"],.txst[data-st="Low power"],.txst[data-st="Wake"]{border-color:var(--warn);color:var(--warn)}
.ch{position:relative}
.scrib{position:relative}
.szid.innum{position:static;display:inline-block;margin-left:5px;padding:0 3px;font-size:10px;vertical-align:1px}
.szid.inname{display:none}
.stxn{display:none}
.szid b.zt{font-weight:800;margin-left:4px;color:#fff}
.szid i.zi{opacity:.85}
.szid b.zt:first-child{margin-left:0}
.szid i.zi{font-style:normal}
.szid{position:absolute;top:2px;left:2px;font-family:var(--f-mono);font-size:9px;font-weight:600;line-height:1;padding:2px 3px;border-radius:2px;background:#0a0b0c;color:var(--accent);border:1px solid var(--line);pointer-events:none}
.stx{position:absolute;top:2px;right:2px;font-family:var(--f-display);font-size:9px;font-weight:700;letter-spacing:.06em;line-height:1;padding:2px 3px;border-radius:2px;background:#0a0b0c;color:var(--ok);border:1px solid var(--ok);pointer-events:none}
/* Nov 12 (Ferris): always a word on a dark chip, never a dot or a filled block, so it reads on any track colour. */
.stx[data-st="Standby"],.stx[data-st="Low power"],.stx[data-st="Wake"]{background:#0a0b0c;color:var(--warn);border-color:var(--warn)}
.txbadge{position:absolute;top:3px;right:4px;font-family:var(--f-display);font-size:9px;font-weight:700;letter-spacing:.08em;padding:0 4px;border-radius:2px;background:var(--warn);color:#111}
.jamrow{flex-wrap:wrap;gap:8px}
.hed{display:block;font-family:var(--f-display);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--warn)}
.hptapbar{align-items:center;gap:8px;flex-wrap:wrap}
.hptapbar .hint{margin:0}
.modal.nt .txt{font-family:var(--f-display);font-weight:600;font-size:var(--t-lg);padding:8px 12px}
/* Track pop-up */
button.scrib{border:0;width:100%;cursor:pointer}
button.scrib:hover{filter:brightness(1.12)}
.modal-back{position:fixed;inset:0;z-index:25;background:rgba(0,0,0,.62);display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow:auto}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:6px;width:min(740px,100%);display:flex;flex-direction:column;gap:12px;padding:16px 20px;box-sizing:border-box;box-shadow:0 20px 50px rgba(0,0,0,.6)}
.modal:has(.itiles){width:min(980px,100%)}  /* meter pop-ups with the input tiles get room for three columns */
.mhead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mhead h3{margin:0;font-family:var(--f-display);font-size:var(--t-xl);font-weight:700;min-width:0;overflow-wrap:anywhere}
.mclose{width:44px;height:44px;flex:none;border-radius:var(--r);border:1px solid var(--line);background:var(--raised);font-size:22px;line-height:1}
.mrow{display:flex;gap:10px;align-items:center}
.minputs{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px}
.minput{display:flex;flex-direction:column;gap:6px;background:var(--raised);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;text-align:left;font-family:var(--f-display);font-weight:600;font-size:var(--t-md);min-height:44px}
.minput[aria-pressed="true"]{border-color:var(--accent-line);box-shadow:inset 0 0 0 1px var(--accent-line)}
.mbar{display:block;height:5px;background:var(--meter-bg);border-radius:3px;overflow:hidden}
.mbar div{height:100%;width:100%;transform-origin:left;transform:scaleX(0)}
.bigmeter .mmeter{height:32px}
.bigmeter .mono{font-size:clamp(16px,2.2vw,24px)}
.mmeter{position:relative;height:24px;border-radius:3px;overflow:hidden;background:linear-gradient(to right,var(--ok) 0 60.2%,var(--warn) 60.2% 79.6%,var(--rec) 79.6%)}
.mmeter .mask{position:absolute;top:0;bottom:0;right:0;width:100%;background:var(--meter-bg)}
.mmeter .pk{position:absolute;top:0;bottom:0;left:0;width:3px;background:#fff}
.mmeter .ref{position:absolute;top:0;bottom:0;left:0;width:3px;background:var(--ref)}
.mticks{position:relative;height:17px;font-family:var(--f-mono);font-size:12px;font-weight:700;color:var(--tick)}
.mticks span{position:absolute;top:0;white-space:nowrap}
.orgrid{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px}
.orgrid.in22{grid-template-columns:repeat(11,minmax(0,1fr))}
@media (max-width:900px){.orgrid.in22{grid-template-columns:repeat(6,minmax(0,1fr))}}
@media (max-width:640px){.orgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.ocell{display:flex;flex-direction:column;gap:4px;min-height:68px;padding:7px 8px;border-radius:var(--r);border:1px solid var(--line);background:var(--raised);text-align:left;min-width:0}
.ocell .otop{display:flex;justify-content:space-between;align-items:center;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.ocell .otop i{width:10px;height:10px;border-radius:2px}
.ocell .onm{font-family:var(--f-display);font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ocell .ost{font-family:var(--f-display);font-weight:600;font-size:11px;letter-spacing:.08em;color:var(--dim)}
.ocell.pre{background:var(--ok);border-color:var(--ok);color:#06140c}
.ocell.post{background:var(--rec);border-color:var(--rec);color:#fff}
/* Tone / Slate / Com tiles (Oct 27): same shape as the routing cells, highlight colour when on */
.ocell.addon{background:var(--accent);border-color:var(--accent-line);color:var(--accent-ink)}
.ocell.addon .otop,.ocell.addon .ost{color:var(--accent-ink)}
.ocell.na{opacity:.4;border-style:dashed;cursor:not-allowed}
.ocell.pre .otop,.ocell.pre .ost{color:#06140c}
.ocell.post .otop,.ocell.post .ost{color:#fff}
.msettings{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px 24px}
.row > .flex > .num:not(.compact){flex:1 1 220px;min-width:0}
.modal .row{grid-template-columns:minmax(80px,104px) minmax(0,1fr)}
.modal .num:not(.compact){grid-template-columns:36px minmax(40px,1fr) 36px minmax(58px,auto)}
/* Output presets + toast */
[hidden]{display:none!important}
.pedlist{display:grid;gap:14px}
.modal.wide{width:min(1100px,100%)}
.modal .ped{background:var(--raised-2)}
.modal .ped .ocell{background:var(--surface)}
.modal .ped .ocell.pre{background:var(--ok)}
.modal .ped .ocell.post{background:var(--rec)}
.modal .ped .opinfo,.modal .ped .txt{background:var(--surface)}
.ped{gap:10px}
.pename{font-family:var(--f-display);font-weight:700;font-size:var(--t-lg)}
.orgrid.pe .ocell{min-height:58px}
.oplist{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,380px),1fr));gap:8px 16px}
.opitem{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;align-items:center}
.opinfo{display:flex;flex-direction:column;gap:3px;padding:8px 12px;border-radius:var(--r);border:1px solid var(--line);background:var(--raised);min-width:0}
.opinfo b{font-family:var(--f-display);font-size:var(--t-md)}
.opsum{font-size:var(--t-sm);color:var(--muted)}
.optracks{font-size:var(--t-sm);overflow-wrap:anywhere}
.opused{font-size:12px;color:var(--accent-line)}
.opsel{max-width:140px;padding:5px 6px;font-size:12px}
.opbtn{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:48px;padding:8px 12px;border-radius:var(--r);border:1px solid var(--line);background:var(--raised);text-align:left;min-width:0}
.opbtn b{font-family:var(--f-display);font-size:var(--t-md);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opbtn span{font-size:var(--t-sm);color:var(--muted);white-space:nowrap}
.opbtn[aria-pressed="true"]{border-color:var(--accent-line);box-shadow:inset 0 0 0 1px var(--accent-line)}
.bxs{width:44px;height:44px;border-radius:var(--r);border:1px solid var(--line);background:var(--raised);font-size:18px;padding:0}
.btn.small{padding:6px 10px;min-height:36px}
/* Nov 3 (Ferris): notices are bigger and in the middle of the screen so they're noticed (they used to sit small at
   the bottom). They don't block anything around them and fade on their own. */
.toast,.locktoast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:70;display:flex;flex-wrap:wrap;justify-content:center;gap:12px 16px;align-items:center;
  font-family:var(--f-display);font-weight:700;font-size:clamp(17px,2.2vw,22px);letter-spacing:.02em;line-height:1.3;text-align:center;
  padding:18px 26px;border-radius:10px;min-width:min(300px,calc(100% - 32px));max-width:min(560px,calc(100% - 32px));box-shadow:0 18px 50px rgba(0,0,0,.6)}
.toast{background:var(--surface);color:var(--fg);border:2px solid var(--accent-line)}
.toast .btn{font-size:16px;padding:8px 16px}
.locktoast{background:var(--rec);color:#fff;border:2px solid #fff}
.toast[hidden],.locktoast[hidden]{display:none}
/* Nov 6: a notice never catches taps meant for what's under it; only its own buttons (Undo) take them. */
.toast,.locktoast{pointer-events:none}
.toast .btn,.locktoast .btn{pointer-events:auto}
@keyframes toastin{from{opacity:0;transform:translate(-50%,-46%)}to{opacity:1;transform:translate(-50%,-50%)}}
.toast:not([hidden]),.locktoast:not([hidden]){animation:toastin .16s ease-out}
@media (prefers-reduced-motion:reduce){.toast:not([hidden]),.locktoast:not([hidden]){animation:none}}
/* Color swatches and bank */
.swbtn{width:44px;height:34px;padding:3px;border:1px solid var(--line);border-radius:var(--r);background:var(--raised);flex:none}
.swfill{display:block;width:100%;height:100%;border-radius:2px}
.picker{position:fixed;z-index:30;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px;box-shadow:0 12px 32px rgba(0,0,0,.55);width:min(280px,calc(100vw - 24px));box-sizing:border-box}
.bankgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.bsw{display:block;width:100%;aspect-ratio:1;border-radius:4px;border:1px solid rgba(255,255,255,.18);padding:0;min-width:0}
button.bsw[aria-pressed="true"]{outline:2px solid var(--fg);outline-offset:2px}
.bankgrid{grid-template-columns:repeat(8,minmax(0,1fr))}
.picker{width:min(340px,calc(100vw - 24px))}
.bankgrid.big{grid-template-columns:repeat(8,minmax(0,1fr));max-width:600px;gap:12px}
.bitem{position:relative}
.bitem .bx{position:absolute;top:-8px;right:-8px;width:24px;height:24px;border-radius:50%;border:1px solid var(--line);background:var(--raised);font-size:14px;line-height:1;padding:0}
/* Input settings box */
.isects{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:16px 28px}
.isect{display:flex;flex-direction:column;gap:10px;min-width:0;padding-top:12px;border-top:1px solid var(--line)}
.isect h4{margin:0;font-family:var(--f-display);font-weight:700;font-size:var(--t-md);letter-spacing:.06em;text-transform:uppercase;color:var(--accent-line)}
/* Track Names page */
.namegrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px 20px}
@media (max-width:1100px){.namegrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.namegrid{grid-template-columns:minmax(0,1fr)}}
/* Track names (Nov 1): tracks 1–8 down the first column, 9–16 down the second, at every size. */
.namegrid.tn{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(8,auto);grid-auto-flow:column}
.namegrid.on{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(4,auto);grid-auto-flow:column}  /* Output names: OUT 1–4, then 5–8 (Nov 2) */
.namerow{display:flex;align-items:center;gap:10px;min-width:0}
.namerow .nnum{width:24px;color:var(--muted);font-size:var(--t-sm)}
.namerow .txt{font-family:var(--f-display);font-weight:600;font-size:var(--t-md)}
/* Routing page */
.cell.rte{width:40px;font-size:10px;font-weight:600}
.cell.pre{background:var(--ok);border-color:var(--ok);color:#06140c}
.cell.post{background:var(--rec);border-color:var(--rec);color:#fff}
.routeseg .seg-b{padding:10px 18px;font-size:var(--t-md)}
.sect{margin:0;font-family:var(--f-display);font-weight:700;font-size:var(--t-xl);letter-spacing:.03em;text-transform:uppercase;padding-bottom:6px;border-bottom:2px solid var(--line);scroll-margin-top:12px}

@media (max-width:860px){
  .grid2{grid-template-columns:minmax(0,1fr)}
  .transport{grid-template-columns:1fr auto}
  .slate{grid-column:1/-1;order:3}
}
@media (max-width:520px){
  .status .stat.opt{display:none}
  .transport{grid-template-columns:1fr}
  .tbtns{justify-content:stretch}
  .tb{flex:1;width:auto}
  .row{grid-template-columns:minmax(0,1fr)}
  .prm{grid-template-columns:minmax(0,1fr)}
  .num{grid-template-columns:36px minmax(0,1fr) 36px minmax(56px,auto)}

  .strips-wrap.tight .strip .pflb{height:calc(100% - 2px);font-size:9px;padding:0 2px}

.secsum{font-size:var(--t-xs);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}

/* Input settings layouts */
.bigmeter h3{margin:0}

.tgroup h4,.scol h4{margin:0;font-family:var(--f-display);font-size:var(--t-sm);font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-line)}
.tgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.vtile{display:flex;flex-direction:column;justify-content:space-between;gap:4px;text-align:left;min-height:62px;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--raised);color:var(--fg);cursor:pointer}

.vtile.blocked{opacity:.4;border-style:dashed}

.vtile .tl .dd{float:right;color:var(--dim);font-size:1.1em;line-height:1}
.vtile[aria-expanded="true"]{border-color:var(--accent-line);box-shadow:inset 0 0 0 1px var(--accent-line)}

.ddlist{position:fixed;z-index:60;background:var(--surface);border:1px solid var(--accent-line);border-radius:6px;box-shadow:0 12px 30px rgba(0,0,0,.45);padding:4px;max-height:min(60vh,420px);overflow:auto}

.ddlist button:hover,.ddlist button:focus-visible{background:var(--raised-2);outline:none}
.ddlist button .ck{width:14px;flex:none;color:var(--accent-line)}
.ddlist button[aria-selected="true"]{color:var(--accent-line)}
input.scribedit.overlay{font-size:var(--t-md);padding:6px 10px;border-radius:var(--r);box-shadow:0 8px 24px rgba(0,0,0,.5)}
input.scribedit{background:var(--surface);color:var(--fg);border:2px solid var(--accent-line);text-transform:uppercase;font-family:var(--f-display);font-weight:700;min-width:0;width:100%}
.scrib[hidden]{display:none}
.clipb{min-height:32px;padding:5px 10px;font-size:var(--t-xs)}

.presetlist{max-height:min(70vh,520px);overflow-y:auto}
.ddlist .ddhead{padding:6px 12px 4px;font-size:var(--t-xs);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

input.haspresets,.scrib.haspresets{-webkit-touch-callout:none}
.scrib.haspresets{-webkit-user-select:none;user-select:none}
.vtile.na{border-style:dashed;background:transparent}

.p48warn{position:fixed;left:50%;top:22%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;align-items:center;gap:6px;max-width:min(90vw,460px);padding:18px 22px;border-radius:10px;background:#2a1517;border:2px solid var(--rec);color:var(--fg);text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.6)}

.vtile[aria-current="true"]{outline:2px solid var(--accent-line);outline-offset:1px}
.editbar[hidden]{display:none}
.editbar{position:sticky;bottom:0;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:8px 12px;border-radius:10px;background:var(--raised-2);border:1px solid var(--line);min-height:56px;z-index:2}

.bsvrow{display:flex;align-items:baseline;justify-content:flex-end;gap:6px;order:2;min-width:0}

.editbar .dstep .bsvwrap .bsvrow{order:0}

.editbar .dstep .dunits .seg-b{flex:1 1 0;padding:8px 6px}
.editbar .dstep .bsvwrap{order:2;display:flex;flex-direction:column;align-items:flex-end;min-width:130px}
.editbar .dstep .bsvwrap .bsv{min-width:0;order:0}
.bssub{font-size:var(--t-xs);color:var(--muted);min-height:1em}
.bsbtns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.editbar .bsbtns{flex:1}
.bsb{height:50px;border-radius:8px;border:2px solid var(--muted);background:var(--surface);color:var(--fg);font-size:26px;font-weight:700;cursor:pointer}
.bsb:active{background:var(--accent);color:var(--accent-ink);border-color:var(--accent-line)}


/* ---------- Phone layout (Oct 30, v2): everything sized to fit one screen where it can ----------
   Shared by both phone options. body[data-phtabs="bottom"] moves the tabs to a bar at the bottom;
   body[data-phsec="1"] shows a page's panels one at a time behind a small section switch. */
.phsecs{display:none}
/* Names (Oct 30): Tracks / Outputs / Colors as tabs at every size */
.phsecs.secs-all{display:inline-flex;flex-wrap:nowrap;align-self:flex-start;margin-bottom:12px}  /* same look and gap as the Routing switch (Oct 30) */
@media (max-width:600px){ .phsecs.secs-all{margin-bottom:8px} }
main.secs-all .phsec-off{display:none !important}
main.secs-all .phsec-panel > h3:first-child{display:none}
@media (max-width:600px){
  #phoneBtn,#tabletBtn{display:none}
  /* status: one line. Brand, link light, rate · bits · frame, Daylight */
  .app{grid-template-columns:minmax(0,1fr)}

  .status .pill{padding:0;border:0;background:none;gap:0;flex:none}
  .status .pill > span{display:none}
  .status .stat{flex-direction:row;gap:0}
  .status .stat .lbl{display:none}
  .status .stat b{font-size:10px;color:var(--muted)}
  .status .stat:not(.opt) + .stat:not(.opt)::before{content:"\00b7";margin-right:5px;color:var(--dim);font-size:10px}
  .status .pill{margin-right:auto}
  .daybtn{height:24px;padding:0 7px;font-size:9px;letter-spacing:.05em;margin-left:2px !important;flex:none}
  /* transport: timecode on one slim line, then the six buttons */
  .transport{padding-block:5px 6px;row-gap:5px}
  .tc-wrap{flex-direction:row;align-items:center;flex-wrap:nowrap;gap:8px;min-width:0}
  .tc-wrap .lbl{font-size:9px;white-space:nowrap}
  .tc{font-size:22px}
  .tc-sub{margin-left:auto;font-size:10px;gap:6px;white-space:nowrap}
  .slate button,.tb{height:46px;padding:4px}
  .slate button b{font-size:16px}
  .slate button.hpslate b{font-size:13px}
  .tb svg{width:17px;height:17px;margin-bottom:1px}
  .tb{font-size:10px}
  /* tabs: 4 × 2 grid, short names */
  .tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;padding-inline:4px;overflow:visible}
  .tab{padding:6px 2px 5px;font-size:12px;text-align:center;letter-spacing:.04em}
  .tl-long{display:none}
  .tl-short{display:inline}
  main{padding-block:8px 12px}
  .stack{gap:8px}
  .panel{padding:10px;gap:8px}
  .panel h3{font-size:15px}
  .sub{gap:8px}
  .row{grid-template-columns:96px minmax(0,1fr);gap:8px}
  .seg-b,.routeseg .seg-b{padding:6px 12px;font-size:13px}
  .btn{padding-block:6px}

  /* option B: the tabs become a bar along the bottom, under your thumb */
  body[data-phtabs="bottom"] .app{grid-template-rows:auto auto 1fr auto}
  body[data-phtabs="bottom"] .tabs{grid-row:4;border-bottom:0;border-top:1px solid var(--line);padding-bottom:max(2px,env(safe-area-inset-bottom,0px))}
  body[data-phtabs="bottom"] main{grid-row:3}
  body[data-phtabs="bottom"] .tabs{padding-top:4px;row-gap:3px}
  body[data-phtabs="bottom"] .tab{border:0;border-radius:9px;padding:12px 2px;font-size:13.5px}
  body[data-phtabs="bottom"] .tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}

  /* section switch (pages with several panels) */
  body[data-phsec="1"] .phsecs:not(.secs-all){display:flex;flex-wrap:nowrap}
  body[data-phsec="1"] .phsecs:not(.secs-all) .seg-b{flex:1 1 0;padding:6px 4px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  body[data-phsec="1"] .phsec-off{display:none !important}
  body[data-phsec="1"] .phsec-panel > h3:first-child{display:none}
  body[data-phsec="1"] .tgroups > .tgroup > h4{display:none}

  /* record enables: four across, the buttons on the title line */
  .armgrid{grid-template-columns:repeat(4,minmax(0,1fr)) !important;gap:6px}
  .armbtn{min-height:76px;padding:6px 7px;gap:2px}
  .armbtn .atop{font-size:10px}
  .armbtn .an{font-size:15px}
  .armbtn .ains{font-size:9px}
  .armhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

  /* inputs: four across, slimmer chips; tiles three across */
  .chlist{grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}
  .ch{padding:4px 6px;gap:3px 5px;grid-template-rows:auto 4px}
  .ch .n{font-size:9px;display:flex;flex-direction:column;align-items:flex-start;gap:1px;line-height:1.1}
  .ch .zid{margin-left:0;padding:0 2px;font-size:8px}
  .ch .nm{font-size:13px;gap:4px}
  .ch .sw{width:7px;height:7px}
  .bigmeter .mmeter{height:22px}
  .bigmeter .mono{font-size:15px}
  .tgroups{gap:8px}
  .tcol{gap:8px}
  .tgrid,.tgrid.t3{grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}
  .vtile{min-height:50px;padding:5px 8px;gap:2px}
  .vtile .tl{font-size:9px;letter-spacing:.05em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .vtile .tv{font-size:15px}
  .vtile.na .tv{font-size:12px}
  .tgrid.t3.big .vtile{min-height:56px;padding:6px 8px}
  .tgrid.t3.big .vtile .tv{font-size:17px}
  .tgroup h4,.rgroup h4,.scol h4{font-size:11px}

  /* routing: one-line pickers, four across; slimmer source tiles */
  .pickrow.p8,.pickrow.p9,.pickrow.p6,.pickrow{grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}
  .pick{min-height:0;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto;padding:5px 6px;gap:0 5px}
  .pick .pnum{grid-row:1;grid-column:1;font-size:10px}
  .pick .pline{grid-row:1;grid-column:2;font-size:13px;gap:4px;min-width:0}
  .pick .psum,.pick .pfx{display:none}
  .pick .sw{width:7px;height:7px}
  .rgroups{gap:6px}
  .rgroup{gap:4px}
  .rgrid{gap:5px}
  /* source tiles: two lines (label + colour, then name with its state beside it) */
  .ocell{min-height:0;padding:4px 6px;display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto auto;gap:1px 4px;align-items:baseline}
  .ocell .otop{grid-column:1 / -1;font-size:10px}
  .ocell .otop i{width:8px;height:8px}
  .ocell .onm{grid-column:1;grid-row:2;font-size:13px;min-width:0}
  .ocell .ost{grid-column:2;grid-row:2;font-size:8px;letter-spacing:.04em}
  .panel > span.lbl:not(.keep){display:none}   /* the "tap for pre-fade…" instructions; Help in Setup › Display shows them */
  body[data-help="1"] .panel > span.lbl{display:block}
  body:not([data-help="1"]) .hptip{display:none}
  .hplegend{gap:4px}
  .hplegend span{font-size:10px;padding:2px 6px}
  .modal .mmeter,.panel .mmeter{height:22px}

  /* names: two columns */
  .namegrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:5px 10px}
  .namerow{gap:5px}
  .namerow .nnum{width:16px;font-size:10px}
  .namerow .txt{height:32px;padding-block:0;font-size:13px}
  .namerow .swbtn,.namerow .colorbtn{width:28px;height:28px}

  /* setup: the section buttons become a compact 3-across switch */
  .secsplit{gap:8px}
  .secnav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}
  .secbtn{min-height:0;padding:7px 6px;align-items:center;text-align:center}
  .secbtn .secname{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .secsplit .panel .row{min-height:0}
}

/* On-screen keyboard (Nov 11): docked at the bottom; the page and pop-ups shrink above it. */
.osk{position:fixed;left:0;right:0;bottom:0;z-index:80;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -12px 32px rgba(0,0,0,.5);padding:6px max(8px,env(safe-area-inset-right,0px)) max(8px,env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));user-select:none;-webkit-user-select:none;touch-action:manipulation}
.osk[hidden]{display:none}
.osk .okbar{display:flex;align-items:center;gap:8px;max-width:1100px;margin:0 auto 6px;min-height:30px}
.osk .okbar .oklbl{flex:1;min-width:0;color:var(--muted);font-size:var(--t-sm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.osk .okhide{background:var(--raised);border:1px solid var(--line);border-radius:var(--r);color:var(--fg);font-size:var(--t-sm);font-weight:600;padding:5px 12px}
.osk .okrows{display:flex;flex-direction:column;gap:6px;max-width:1100px;margin:0 auto}
.osk.oknum .okrows{max-width:440px}
.osk .okrow{display:flex;gap:6px}
.osk .okrow.inset{padding:0 4.5%}
.osk .k{flex:1 1 0;min-width:0;height:clamp(42px,6.4vh,58px);border:1px solid var(--line);border-radius:var(--r);background:var(--raised-2);color:var(--fg);font:600 clamp(17px,2.5vh,23px)/1 var(--f-display);display:grid;place-items:center;padding:0;cursor:pointer}
.osk .k.w15{flex-grow:1.5}.osk .k.w5{flex-grow:5}
.osk .k.fn{background:var(--raised);color:var(--muted);font-size:var(--t-sm);font-weight:700;letter-spacing:.06em}
.osk .k.on,.osk .k.go{background:var(--accent);color:var(--accent-ink);border-color:var(--accent-line)}
.osk .k.lock{box-shadow:inset 0 -3px 0 var(--accent-ink)}
.osk .k:active,.osk .k.down{filter:brightness(1.4)}
/* Nov 12 (Ferris, photo of the 7-inch cart screen): small text stayed tiny because the type scale followed the
   screen's short side (9–11 px at 600 px tall). Higher floors, bolder, and on the meter columns the numbers, tags and
   PFL grow with the strip's own width. Rows (phones, upright tablets) keep their own sizes. */
@media (min-width:601px) and (orientation:landscape), (min-width:1101px){
  :root{--t-xs:clamp(11px,1.35vmin,13px);--t-sm:clamp(13px,1.65vmin,15px);--t-md:clamp(14px,1.85vmin,17px)}
  .lbl{font-weight:700}
  .stat b{font-weight:600;font-size:var(--t-md)}
  .tc-sub{font-size:var(--t-md);font-weight:700}
  .tc{white-space:nowrap}
  /* Nov 12: on the meter columns the name box holds only the name; the power label joins the ZNet pill under it. */
  .strip:not(.scale) .scrib{display:flex;align-items:center;justify-content:center}
  .strip:not(.scale) .scrib .snm{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .strip:not(.scale) .scrib .rtag{display:none}
  /* Nov 13 (Ferris: "the pill doesn't look as nice when shrunken"): one pill, one font, one height, a hairline
     between the power word and the numbers, the ZNet ID quieter than the trim, the edge tinted by the state. */
  .zpill{display:inline-flex;align-items:center;gap:.42em;margin-left:.45em;padding:.2em .5em;border-radius:.45em;background:#0a0b0c;border:1px solid #2c3238;font-family:var(--f-mono);font-weight:700;line-height:1;vertical-align:.08em;white-space:nowrap}
  .zpill:not(:has(> :not([hidden]))){display:none}
  .zpill .stxn:not([hidden]){display:inline;font-family:inherit;font-size:inherit;font-weight:800;letter-spacing:.04em;color:var(--ok);padding-right:.42em;border-right:1px solid rgba(255,255,255,.16)}
  .zpill .stxn:not([hidden]):last-child{padding-right:0;border-right:0}
  .zpill .stxn[data-st="Standby"],.zpill .stxn[data-st="Low power"],.zpill .stxn[data-st="Wake"]{color:var(--warn)}
  .zpill:has(.stxn[data-st="On"]:not([hidden])){border-color:color-mix(in srgb,var(--ok) 45%,#2c3238)}
  .zpill:has(.stxn[data-st="Standby"]:not([hidden]),.stxn[data-st="Low power"]:not([hidden]),.stxn[data-st="Wake"]:not([hidden])){border-color:color-mix(in srgb,var(--warn) 60%,#2c3238)}
  .zpill .szid.innum{display:inline;margin:0;padding:0;background:none;border:0;border-radius:0;font-size:inherit;line-height:1;vertical-align:baseline}
  .zpill .szid.innum[hidden]{display:none}
  .zpill .szid .zi{color:#8d969e;font-weight:600}
  .zpill .szid .zt{color:#fff;font-weight:800;margin-left:.35em}
  .zpill .szid .zt:first-child{margin-left:0}
  @supports (container-type:inline-size){
    .strip:not(.scale){container-type:inline-size}
    .sinfo{font-size:clamp(11px,7.2cqi,19px)}
    .strip .pflb{font-size:clamp(12px,6.6cqi,18px);min-height:clamp(24px,10cqi,38px)}
    /* Nov 13 (Ferris, photo of the cart screen): the meter titles grow with the strip too (never smaller than before);
       a long name steps down to fit (fitNames). */
    .strip:not(.scale) .scrib{font-size:max(clamp(11px,calc(0.9vw + 6px),17px),min(9.5cqi,28px));font-weight:800;padding-block:max(4px,1.8cqi)}
    /* Nov 12 (Ferris): the ZNet pill and its power label (ON / STBY / LOW / WAKE) scale with the meter strip. */
    .zpill{font-size:clamp(10px,6cqi,17px)}
    /* Narrow strips: "+12" instead of "+12 dB" so the number, ZNet tag and trim fit. */
    @container (max-width:120px){ .sinfo .u{display:none} }
    /* Narrow strips: the pill keeps the power label and the trim; the ZNet ID steps out ([ON|25]). */

   Mirror reading keeps a steady width so its neighbours don't jump as the numbers change. */
@media (min-width:601px){
  .app{grid-template-columns:minmax(0,1fr)}

  .status .brand,.status .pill{flex:0 1 auto;min-width:0;overflow:hidden}

  .status #stMirrorBox{flex:none}

  .status .daybtn{flex:none}

@media (max-width:1250px){ #phoneBtn,#tabletBtn{display:none} }  /* prototype-only preview buttons */
@media (min-width:601px) and (max-width:900px){  /* narrow windows: the title, TLOC and Primary step out so the rest reads in full */
  .status .brand,.status .stat:has(#stDrive),.status #stPriBox{display:none}

}

const ballistics = new Map();
let COLORS = {};

function ballistic(id, db, dt){
  let b = ballistics.get(id); if(!b){ b = {d:-90, hold:0, p:-90, ph:0}; ballistics.set(id, b); }
  const mh = get("meters.meter.hold"), md = get("meters.meter.decay"), pk = get("meters.peak.hold"), pd = get("meters.peak.decay");
  if(db >= b.d){ b.d = db; b.hold = mh; } else if((b.hold -= dt) <= 0) b.d = Math.max(db, b.d - dt * 20 / md);
  if(db >= b.p){ b.p = db; b.ph = pk; } else if((b.ph -= dt) <= 0) b.p = Math.max(b.d, b.p - dt * 20 / pd);
  return b;
}
const FLOOR = -60;
const yOf = (db, H) => { const n = Math.max(0, Math.min(1, (db - FLOOR) / -FLOOR)); return H - Math.pow(n, 1.25) * H; };

function meterSlots(){
  const src = get("home.meters.source"), out = [];
  if(src === 1){ for(let o = 0; o < 8; o++) out.push({id:"o" + o, kind:"o", name:outName(o) || `OUT ${o+1}`, num:o+1, db:() => outDb(o)}); return out; }
  const rt = get("record.tracks");

    if(rt[i]) out.push({id:"t" + i, kind:"t", t:i, name:get("track.name", [i]) || `TRK ${i+1}`, num:i+1, db:() => trackDb(i)});
  }

  return out;
}
function drawBridge(cv, slots, dt){
  const dpr = devicePixelRatio || 1, W = cv.clientWidth, Hh = cv.clientHeight;
  if(cv.width !== Math.round(W * dpr) || cv.height !== Math.round(Hh * dpr)){ cv.width = Math.round(W * dpr); cv.height = Math.round(Hh * dpr); }
  const c = cv.getContext("2d"); c.setTransform(dpr, 0, 0, dpr, 0, 0); c.clearRect(0, 0, W, Hh);
  const scaleW = 30, top = 6, bottom = 22, H = Hh - top - bottom, n = slots.length;
  const gap = Math.max(3, Math.min(10, (W - scaleW) / n * 0.22)), bw = (W - scaleW - gap * (n + 1)) / n;
  c.font = "700 12px " + getComputedStyle(document.body).getPropertyValue("--f-mono");
  c.textAlign = "right"; c.textBaseline = "middle";
  [0,-6,-12,-20,-30,-40,-60].forEach(d => {
    const y = top + yOf(d, H); c.fillStyle = COLORS["--tick"]; c.fillText(String(d), scaleW - 6, y);
    c.fillStyle = COLORS["--line"]; c.fillRect(scaleW, Math.round(y) + 0.5, W - scaleW, 1);
  });
  const yWarn = top + yOf(-20, H), yRed = top + yOf(-10, H);
  slots.forEach((s, i) => {
    const x = scaleW + gap + i * (bw + gap), b = ballistic(s.id, s.db(), dt), y = top + yOf(b.d, H);
    c.fillStyle = "rgba(255,255,255,0.035)"; c.fillRect(x, top, bw, H);
    // segmented fill
    const seg = 4;
    for(let yy = top + H; yy > y; yy -= seg){
      const y0 = Math.max(y, yy - seg + 1);
      c.fillStyle = yy <= yRed ? COLORS["--rec"] : yy <= yWarn ? COLORS["--warn"] : COLORS["--ok"];
      c.fillRect(x, y0, bw, yy - y0 - 1 > 0 ? yy - y0 - 1 : 1);
    }
    const py = top + yOf(b.p, H);
    c.fillStyle = b.p > -3 ? COLORS["--rec"] : COLORS["--fg"]; if(b.p > FLOOR) c.fillRect(x, py - 1, bw, 2);
    c.textAlign = "center"; c.fillStyle = COLORS["--tick"]; c.fillText(String(s.num), x + bw / 2, top + H + 12);
  });
}

  if(DRIVES.mir) tip += ` \u00b7 ${DRIVES.mirDrive || "Mirror"}: ${DRIVES.mir} free${DRIVES.mirName ? " (" + DRIVES.mirName + ")" : ""}`;
  mir.textContent = txt; box.title = tip;
  /* 100% on the last file = everything mirrored (the Nova leaves it there); anything less is still copying. */
  const done = DRIVES.state === "mirroring" && DRIVES.pct >= 100 && (!DRIVES.files || DRIVES.file >= DRIVES.files);
  mir.style.color = DRIVES.state === "mirroring" ? (done ? COLORS["--ok"] || "" : COLORS["--warn"] || "") : "";
  if(DRIVES.pri) $("stPriBox").title = `Primary drive: ${DRIVES.pri} free`;
}
/* Simulator: talks like the Nova, mirroring file by file behind the recording. */
let simMirror = {file:78, files:78, pct:100, tick:0, flip:false};
function simStatusText(dt){
  if(!get("mirror.mode")) return " [ ::  :: Mirror = Off]";
  const sm = simMirror; sm.tick += dt;
  /* Ferris (Nov 1): a new take starts a new file and its percentage climbs in real time while recording;
     when everything is mirrored the Nova just leaves it at 100%. */
  if(sim.state === "RECORDING" && sm.file >= sm.files && sm.pct >= 100){ sm.files += 1; sm.file = sm.files; sm.pct = 0; }
  if(sm.pct < 100) sm.pct = sim.state === "RECORDING" ? Math.min(99, sm.pct + dt * 3) : Math.min(100, sm.pct + dt * 12);
  if(sm.tick > 1){ sm.tick = 0; sm.flip = !sm.flip; }
  const drive = sm.flip ? "CF1: 61GB free (102126_DUAL)" : "Pri: 69GB free";
  return sm.pct >= 100 && sim.state !== "RECORDING" ? ` [${drive} :: Mirroring (100%)  :: Mirror = Cont]` : ` [${drive} :: Mirroring (${Math.floor(sm.pct)}%)  :: File ${sm.file} of ${sm.files}]`;
}
/* No recorder to show (shipped versions with no Nova connected): timecode reads dashes. */
const noRecorder = () => !EXAMPLE && !novaConnected();
function frame(t){
  const prev = sim.lastT; sim.tick(t); const dt = Math.min(0.1, (t - prev) / 1000);
  if(!novaConnected() && EXAMPLE) V["status.text"] = simStatusText(dt);
  const fr = sim.fr();
  let tcFrames = sim.genFrames;
  if(get("timecode.displayed") === 0){ tcFrames = sim.state === "RECORDING" ? sim.genFrames : sim.state === "PLAYING" ? sim.playStart + sim.elapsed * fr.r : sim.genFrames; }
  $("tc").textContent = noRecorder() ? "--:--:--:--" : framesToTC(tcFrames, fr);
  $("stElapsed").textContent = fmtDur(sim.elapsed);
  if(t - lastStatus > 500){
    lastStatus = t;
    $("stDrive").textContent = (() => { const s = V["drive.time.remaining"]; return s == null ? "\u2014" : `${Math.floor(s/3600)}h ${String(Math.floor(s/60)%60).padStart(2,"0")}m`; })();
    $("stBatt").textContent = V["battery.status"] && V["battery.status"].volts != null ? V["battery.status"].volts.toFixed(1) + " V" : "\u2014";
    paintDrives();
  }
  frameHooks.forEach(f => f(dt));
  requestAnimationFrame(frame);
}

/* Help (Nov 6): the prototype opens the manual doc; the shipped versions open the manual that comes with them. */
const MANUAL_URL = "https://claude.ai/artifact/ND3uz3CQBQaCHVWS3CrPvm";
function openHelp(){ window.open(MANUAL_URL, "_blank", "noopener"); }
/* ---------- Boot ---------- */
if(EXAMPLE) seed(); else seedBlank();
const hadSaved = load();
if(V["ui.inlayout"] !== 2){ if(hadSaved && EXAMPLE) seedInputs(); V["ui.inlayout"] = 2; V["ui.inorder"] = 1; saveSoon(); }
if(!hadSaved) V["ui.inorder"] = 1;
if(migrateInputOrder()) saveSoon();
if(V["ui.takemodel"] !== 1){
  const h0 = (V["metadata.history"] || []).find(Boolean);
  if(h0 && h0.scene === V["scene.current"] && /^\d+$/.test(h0.take) && /^\d+$/.test(V["take.current"]) && +V["take.current"] === +h0.take + 1) V["take.current"] = h0.take;
  V["ui.takemodel"] = 1; saveSoon();
}
if(V["ui.compfix"] !== 1){
  if(JSON.stringify(V["input.compress.attack"]) === "[1,1,1]" && JSON.stringify(V["input.compress.ratio"]) === "[1.1,1.1,1.1]"){
    V["input.compress.attack"] = [5, 3, 10]; V["input.compress.decay"] = [60, 40, 80];
    V["input.compress.thresh"] = [-6, -8, -4]; V["input.compress.ratio"] = [3, 4, 2]; V["input.compress.gain"] = [0, 2, 0];
  }
  V["ui.compfix"] = 1; saveSoon();
}
if(V["ui.tmxmode"] !== 1){
  V["trackmix.matrix"].forEach(pr => pr.forEach(row => row.forEach((v, i) => { row[i] = v === 0 ? 0 : v === 7 ? 1 : v === 1 || v === 2 ? v : 2; })));
  V["ui.tmxmode"] = 1; saveSoon();
}
/* Output routes used to be stored by track number (0–15) for every output. They now use the Nova's source
   numbers: OUT 5–8 keep their track routes (moved to 30–45); OUT 1–4 take inputs, so their old track routes go. */
function migrateOutSources(){
  if(V["ui.outsrc"] === 1) return false;
  const m = V["outputmix.matrix"][0];
  m.forEach((row, o) => { const old = row.slice(0, 16); for(let t = 0; t < 22 && t < row.length; t++) row[t] = 0;
    if(o >= 4) old.forEach((v, t) => { if(v) row[SRC_TRACK + t] = v; }); });
  if(EXAMPLE && !m.some(r => r.some(v => v))){
    /* simulator example: boom and plant on OUT 1–2, two lavs on OUT 3, MIX L / MIX R on OUT 5 / 6 */
    m[0][0] = 1; m[1][1] = 1; m[2][14] = 1; m[2][15] = 1; m[4][SRC_TRACK] = 1; m[5][SRC_TRACK + 1] = 1;
  }
  const ps = V["ui.outpresets"];
  if(Array.isArray(ps)) V["ui.outpresets"] = ps.filter(Boolean).map(p => p.s ? p : {name:p.name, kind:"tr",
    s:Object.fromEntries((p.r || []).map((v, t) => [SRC_TRACK + t, v]).filter(([, v]) => v)), a:Array.isArray(p.a) ? p.a : [0, 0, 0, 0]});
  V["ui.outsrc"] = 1;
  return true;
}
if(migrateOutSources()) saveSoon();
/* OUT 5–8 routes are on/off (1); older setups stored post-fade (2). */
function normalizeOutRoutes(){
  let ch = false;
  V["outputmix.matrix"][0].forEach((row, o) => { if(o >= 4) row.forEach((v, sx) => { if(v > 1){ row[sx] = 1; ch = true; } }); });
  (V["ui.outpresets"] || []).forEach(p => { if(p && p.kind === "tr" && p.s) for(const k in p.s) if(p.s[k] > 1){ p.s[k] = 1; ch = true; } });
  return ch;
}
if(normalizeOutRoutes()) saveSoon();
syncAllColors("local");
if(V["hpmix.preset"] > HP_COUNT) V["hpmix.preset"] = 1;
if(EXAMPLE && !presetsList().length){
  const tr = (...ts) => Object.fromEntries(ts.map(t => [SRC_TRACK + t - 1, 1])), inp = (...is) => Object.fromEntries(is.map(i => [i, 1]));
  V["ui.outpresets"] = [{name:"MIX L", kind:"tr", s:tr(1), a:[1,0,0,0]}, {name:"MIX R", kind:"tr", s:tr(2), a:[1,0,0,0]},
    {name:"MIX L + R", kind:"tr", s:tr(1, 2), a:[0,0,0,0]}, {name:"BOOM", kind:"in", s:inp(0), a:[0,0,0,0]}];
}
sim.init();
seedDevice();
wireChrome();
applyLayout();
applyPhoneOpts();
let startTab = "home"; try{ startTab = localStorage.getItem("cart-remote-tab") || "home"; }catch(e){}
const hashTab = (location.hash || "").slice(1); if(VIEWS.some(v => v[0] === hashTab)) startTab = hashTab;
go(VIEWS.some(v => v[0] === startTab) ? startTab : "home");
renderTransport();
log("ev", `Connected to simulated recorder · ${SCHEMA.length} settings · protocol 01.01`);
requestAnimationFrame(t => { sim.lastT = t; requestAnimationFrame(frame); });
</script>
